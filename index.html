<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF Redactor OCR</title><link rel="stylesheet" href="./css/styles.css"></head><body>
<header><div><h1>PDF Redactor</h1><small>Local processing • OCR-assisted pattern redaction</small></div><button id="theme">◐</button></header>
<section class="bar"><label class="btn primary">Upload PDF<input id="file" type="file" accept="application/pdf" hidden></label><button id="preset">Load anonymisation patterns</button><button id="ocrAll">OCR all pages</button><button id="find">Find matches</button><button id="apply">Apply previews</button><button id="manual" aria-pressed="false">Manual</button><button id="undo">Undo</button><button id="redo">Redo</button><button id="clear">Clear</button><button id="export" class="primary">Export PDF</button></section>
<section class="settings"><textarea id="query" rows="5" placeholder="One literal term or regular expression per line"></textarea><div class="checks"><label><input id="regex" type="checkbox" checked> Regular expressions</label><label><input id="case" type="checkbox"> Case-sensitive</label><label><input id="whole" type="checkbox"> Whole word</label><label><input id="accents" type="checkbox" checked> Match accents</label><label><input id="all" type="checkbox" checked> All occurrences</label><label>OCR language <select id="lang"><option value="eng">English</option><option value="eng+ita">English + Italian</option><option value="eng+fra">English + French</option><option value="eng+ara">English + Arabic</option></select></label><label>OCR quality <select id="quality"><option value="2">Fast</option><option value="3" selected>Enhanced</option><option value="4">Maximum</option></select></label></div></section>
<section class="nav"><button id="minus">−</button><output id="zoom">100%</output><button id="plus">+</button><label>Page <input id="page" type="number" min="1" value="1"></label><button id="go">Go</button><span id="matches">0 matches</span><span id="ocr">OCR idle</span><span id="status"></span></section>
<main id="drop"><div id="empty"><b>Drop a PDF here</b><span>or use Upload PDF</span></div><div id="viewer"></div></main><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script type="module" src="./js/app.js"></script></body></html>
